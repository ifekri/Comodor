<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Comodor</title>
<style>
  :root {
    --bg: #0d0c0b;      --panel: #141210;   --line: #26221e;
    --ink: #e8e2d8;     --dim: #8a8177;     --faint: #5c554d;
    --accent: #e8a44c;  --good: #7fb069;    --bad: #d1656b;
    --user: #d8cfc2;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.65 var(--mono);
    display: flex; flex-direction: column;
  }

  header {
    display: flex; align-items: baseline; gap: 1.5rem;
    padding: .7rem 1.2rem; border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  header .name { color: var(--accent); letter-spacing: .04em; }
  header .where { color: var(--faint); font-size: 12px; }
  header .spacer { flex: 1; }
  header .stat { color: var(--dim); font-size: 12px; white-space: nowrap; }
  header .stat b { color: var(--ink); font-weight: 500; }

  #modes { display: flex; gap: .3rem; }
  #modes button {
    background: none; border: 1px solid var(--line); color: var(--dim);
    font: inherit; font-size: 12px; padding: .1rem .55rem; cursor: pointer;
    border-radius: 2px;
  }
  #modes button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }

  main {
    flex: 1; overflow-y: auto; padding: 1.4rem 1.2rem 2rem;
    display: flex; flex-direction: column; gap: 1.1rem;
  }
  .turn { max-width: 92ch; }
  .turn.user { color: var(--user); }
  .turn.user::before { content: "› "; color: var(--accent); }
  .turn.agent { white-space: pre-wrap; word-break: break-word; }
  .turn.notice { color: var(--dim); font-size: 12.5px; }
  .turn.error { color: var(--bad); }

  .tool {
    display: grid; grid-template-columns: 8ch 1fr auto; gap: .8rem;
    align-items: baseline; color: var(--dim); font-size: 13px;
  }
  .tool .verb { color: var(--accent); }
  .tool .target { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool .time { color: var(--faint); font-size: 12px; }
  .tool pre {
    grid-column: 2 / -1; margin: .3rem 0 0; padding: .5rem .7rem;
    background: var(--panel); border-left: 2px solid var(--line);
    color: var(--faint); font-size: 12.5px; max-height: 14em;
    overflow: auto; white-space: pre-wrap;
  }

  #ask {
    border: 1px solid var(--accent); background: var(--panel);
    padding: .9rem 1.1rem; max-width: 92ch;
  }
  #ask p { margin: 0 0 .3rem; }
  #ask pre {
    margin: .4rem 0 .8rem; color: var(--dim); font-size: 12.5px;
    max-height: 16em; overflow: auto; white-space: pre-wrap;
  }
  #ask button {
    background: none; border: 1px solid var(--line); color: var(--ink);
    font: inherit; padding: .25rem .9rem; margin-right: .4rem; cursor: pointer;
  }
  #ask button:hover { border-color: var(--accent); color: var(--accent); }

  footer { border-top: 1px solid var(--line); padding: .8rem 1.2rem 1rem; }
  form { display: flex; gap: .8rem; align-items: flex-end; max-width: 92ch; }
  textarea {
    flex: 1; background: transparent; border: none; color: var(--ink);
    font: inherit; resize: none; outline: none; max-height: 40vh;
  }
  textarea::placeholder { color: var(--faint); }
  form button {
    background: none; border: 1px solid var(--line); color: var(--dim);
    font: inherit; font-size: 12px; padding: .25rem .9rem; cursor: pointer;
  }
  form button:hover { border-color: var(--accent); color: var(--accent); }
  .hint { color: var(--faint); font-size: 11.5px; margin-top: .45rem; }

  /* Right-to-left text is set to the right, where its line begins. */
  .rtl { direction: rtl; text-align: right; font-family: Tahoma, var(--mono); }
</style>
</head>
<body>

<header>
  <span class="name">Comodor</span>
  <span class="where" id="where"></span>
  <div id="modes">
    <button data-mode="act">Act</button>
    <button data-mode="plan">Plan</button>
    <button data-mode="chat">Chat</button>
  </div>
  <span class="spacer"></span>
  <span class="stat" id="stat"></span>
</header>

<main id="log"></main>

<footer>
  <div id="ask" hidden></div>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Ask for something…"
              autocomplete="off" spellcheck="false"></textarea>
    <button type="submit" id="send">Send</button>
    <button type="button" id="stop" hidden>Stop</button>
  </form>
  <div class="hint">Enter sends · Shift-Enter for a new line</div>
</footer>

<script>
"use strict";

const log = document.getElementById("log");
const input = document.getElementById("input");
const stat = document.getElementById("stat");
const ask = document.getElementById("ask");
const stopButton = document.getElementById("stop");
let cursor = 0, streaming = null, tools = new Map(), busy = false;

// Right-to-left scripts: Arabic, Hebrew, and the Persian range.
const RTL = /[֐-׿؀-ۿ܀-ݏݐ-ݿﭐ-﷿ﹰ-﻿]/;

function post(path, body) {
  return fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Comodor": "1" },
    body: JSON.stringify(body || {}),
  }).then(r => r.json().catch(() => ({})));
}

function atBottom() {
  return log.scrollHeight - log.scrollTop - log.clientHeight < 80;
}

function add(className, text) {
  const stick = atBottom();
  const node = document.createElement("div");
  node.className = "turn " + className;
  node.textContent = text || "";
  if (RTL.test(text || "")) node.classList.add("rtl");
  log.appendChild(node);
  if (stick) log.scrollTop = log.scrollHeight;
  return node;
}

function toolRow(id, verb, target) {
  const stick = atBottom();
  const row = document.createElement("div");
  row.className = "tool";
  row.innerHTML = '<span class="verb"></span><span class="target"></span>' +
                  '<span class="time">…</span>';
  row.children[0].textContent = verb;
  row.children[1].textContent = target;
  log.appendChild(row);
  tools.set(id, row);
  if (stick) log.scrollTop = log.scrollHeight;
  return row;
}

function setBusy(value) {
  busy = value;
  stopButton.hidden = !value;
  document.getElementById("send").disabled = value;
}

function showStat(state) {
  const u = state.usage || {};
  const bits = [];
  if (u.prompt) bits.push(`${u.prompt.toLocaleString()} in`);
  if (u.output) bits.push(`${u.output.toLocaleString()} out`);
  if (u.cached) bits.push(`${Math.round((u.hit_rate || 0) * 100)}% cached`);
  if (u.cost) bits.push(`$${u.cost.toFixed(4)}`);
  stat.innerHTML = bits.length ? bits.join(" · ") : "";
}

function showAsk(event) {
  ask.hidden = false;
  ask.innerHTML = "";
  const question = document.createElement("p");
  question.textContent = event.prompt || "Allow this?";
  ask.appendChild(question);
  if (event.detail) {
    const detail = document.createElement("pre");
    detail.textContent = event.detail;
    ask.appendChild(detail);
  }
  (event.options || ["yes", "no"]).forEach(option => {
    const button = document.createElement("button");
    button.textContent = option;
    button.onclick = () => {
      ask.hidden = true;
      post("/api/answer", { id: event.id, choice: option });
    };
    ask.appendChild(button);
  });
  ask.scrollIntoView({ block: "nearest" });
}

function apply(event) {
  switch (event.kind) {
    case "user_message":
      add("user", event.text); break;
    case "assistant_start":
      streaming = null; break;
    case "assistant_delta":
      if (!streaming) streaming = add("agent", "");
      streaming.textContent += event.text || "";
      if (RTL.test(streaming.textContent)) streaming.classList.add("rtl");
      if (atBottom()) log.scrollTop = log.scrollHeight;
      break;
    case "assistant_end":
      if (streaming && !streaming.textContent && event.text)
        streaming.textContent = event.text;
      streaming = null; break;
    case "tool_start":
      toolRow(event.id, event.name || "tool", event.summary || ""); break;
    case "tool_end": {
      const row = tools.get(event.id);
      if (!row) break;
      row.children[2].textContent = (event.elapsed || 0).toFixed(1) + "s";
      row.children[2].style.color = event.ok === false ? "var(--bad)" : "";
      const preview = (event.display || "").trim();
      if (preview) {
        const pre = document.createElement("pre");
        pre.textContent = preview.length > 4000
          ? preview.slice(0, 4000) + "\n…" : preview;
        row.appendChild(pre);
      }
      tools.delete(event.id);
      break;
    }
    case "notice":   add("notice", event.text); break;
    case "error":    add("error", event.text); streaming = null; break;
    case "cancelled":add("notice", "stopped"); streaming = null; break;
    case "request":  showAsk(event); break;
    case "usage":
      showStat({ usage: { prompt: event.input_tokens, output: event.output_tokens,
                          cost: event.cost_usd } });
      break;
    case "status":
      if (typeof event.busy === "boolean") setBusy(event.busy);
      if (event.mode) markMode(event.mode);
      break;
    case "turn_end": setBusy(false); break;
  }
}

function markMode(mode) {
  document.querySelectorAll("#modes button").forEach(button => {
    button.setAttribute("aria-pressed", String(button.dataset.mode === mode));
  });
}

async function poll() {
  for (;;) {
    try {
      const response = await fetch("/api/events?cursor=" + cursor);
      if (response.status === 401) { location.reload(); return; }
      const data = await response.json();
      (data.events || []).forEach(apply);
      cursor = data.cursor || cursor;
      if (typeof data.busy === "boolean") setBusy(data.busy);
    } catch (error) {
      // The server went away, or a proxy cut the connection. Wait, retry —
      // a reload would lose nothing, but it would also lose the scroll.
      await new Promise(resolve => setTimeout(resolve, 1500));
    }
  }
}

document.getElementById("form").addEventListener("submit", event => {
  event.preventDefault();
  const text = input.value.trim();
  if (!text || busy) return;
  input.value = "";
  input.style.height = "auto";
  post("/api/send", { text });
});

input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    document.getElementById("form").requestSubmit();
  }
});
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, window.innerHeight * 0.4) + "px";
  input.classList.toggle("rtl", RTL.test(input.value));
});

stopButton.onclick = () => post("/api/interrupt", {});
document.querySelectorAll("#modes button").forEach(button => {
  button.onclick = () => {
    markMode(button.dataset.mode);
    post("/api/mode", { mode: button.dataset.mode });
  };
});

fetch("/api/state").then(r => r.json()).then(state => {
  document.getElementById("where").textContent = state.project || "";
  document.title = "Comodor — " + (state.model || "");
  markMode(state.mode);
  setBusy(state.busy);
  showStat(state);
  poll();
});

input.focus();
</script>
</body>
</html>
