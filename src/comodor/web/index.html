<div id="shell" data-rail="open">

  <!-- ---------------------------------------------------------------- top -->
  <header id="top">
    <button class="icon-btn" id="rail-toggle" aria-label="Hide the chat list"
            aria-expanded="true" aria-controls="rail" title="Chats">
      <svg><use href="#i-rail"/></svg>
    </button>

    <a class="brand" href="/" aria-label="Comodor">
      <svg viewBox="0 0 512 512" fill="var(--accent)" aria-hidden="true">
        <use href="#i-mark"/></svg>
      <span class="words">
        <span class="name">Comodor</span>
        <span class="tag">learns the way you correct it.</span>
      </span>
    </a>

    <span class="divider" aria-hidden="true"></span>

    <button id="whoami" title="Change the model">
      <span class="provider" id="who-provider">—</span>
      <span class="sep" aria-hidden="true">›</span>
      <span class="model" id="who-model">—</span>
    </button>

    <span class="grow"></span>

    <div id="tools-row">
      <a class="icon-btn optional" id="repo" href="https://github.com/ifekri/Comodor"
         target="_blank" rel="noreferrer noopener" title="Source" aria-label="Source">
        <svg><use href="#i-github"/></svg></a>
      <button class="icon-btn" id="admin-jump" title="What this agent can do"
              aria-label="What this agent can do">
        <svg><use href="#i-tools"/></svg></button>
      <button class="icon-btn" id="theme" title="Light or dark"
              aria-label="Switch to light theme">
        <svg id="theme-icon"><use href="#i-sun"/></svg></button>
      <button class="icon-btn danger" id="quit" title="Close this session"
              aria-label="Close this session">
        <svg><use href="#i-power"/></svg></button>
    </div>
  </header>

  <!-- --------------------------------------------------------------- rail -->
  <nav id="rail" aria-label="Chats and settings">
    <div class="rail-top">
      <div class="tabs" role="tablist" aria-label="Sidebar">
        <button role="tab" id="tab-chat" aria-selected="true"
                aria-controls="panel-chat">Chat</button>
        <button role="tab" id="tab-rules" aria-selected="false"
                aria-controls="panel-rules">Rules</button>
        <button role="tab" id="tab-admin" aria-selected="false"
                aria-controls="panel-admin">Admin</button>
      </div>
      <button class="icon-btn" id="rail-close" aria-label="Close the chat list">
        <svg><use href="#i-close"/></svg></button>
    </div>

    <div class="panel" id="panel-chat" role="tabpanel" aria-labelledby="tab-chat"
         data-open="true">
      <div class="finder">
        <label class="field">
          <svg aria-hidden="true"><use href="#i-search"/></svg>
          <input id="find" type="search" placeholder="Search chats"
                 autocomplete="off" aria-label="Search chats">
        </label>
        <button class="ghost-btn" id="new-chat" title="New chat"
                aria-label="New chat"><svg><use href="#i-new"/></svg></button>
      </div>
      <div id="chats" role="list"></div>
    </div>

    <div class="panel" id="panel-rules" role="tabpanel" aria-labelledby="tab-rules">
      <form class="finder" id="rule-form">
        <label class="field">
          <svg aria-hidden="true"><use href="#i-rule"/></svg>
          <input id="rule-text" type="text" maxlength="300"
                 placeholder="Always run the tests before saying done"
                 autocomplete="off" aria-label="Write a rule">
        </label>
        <button class="ghost-btn" type="submit" id="rule-add" title="Add this rule"
                aria-label="Add this rule"><svg><use href="#i-new"/></svg></button>
      </form>
      <div id="rules-body"></div>
    </div>

    <div class="panel" id="panel-admin" role="tabpanel" aria-labelledby="tab-admin">
      <div id="admin-body"></div>
    </div>
  </nav>

  <div id="rail-grip" role="separator" aria-orientation="vertical"
       aria-label="Resize the sidebar" tabindex="0"
       aria-valuemin="220" aria-valuemax="520" aria-valuenow="292"></div>

  <div id="scrim" aria-hidden="true"></div>

  <!-- --------------------------------------------------------------- main -->
  <main id="main">
    <section id="screen" data-on="false" aria-label="The screen the agent is using">
      <img id="frame" alt="The last thing the agent looked at">
      <p class="caption" id="caption"></p>
    </section>

    <div id="log" tabindex="0" aria-label="Conversation">
      <div class="stream" id="stream" aria-live="polite"></div>
    </div>

    <section id="setup" hidden aria-label="Set Comodor up"></section>
  </main>

  <!-- ---------------------------------------------------------- questions -->
  <div id="form-back" hidden></div>
  <div id="form" hidden role="dialog" aria-modal="true" aria-labelledby="form-title">
    <div class="head">
      <h2 id="form-title"></h2>
      <span class="count"></span>
    </div>
    <div class="tabs" role="tablist" hidden></div>
    <div class="body"></div>
    <div class="foot">
      <span class="keys"></span>
      <span class="spacer"></span>
      <button type="button" class="skip"></button>
      <button type="button" class="send"></button>
    </div>
  </div>

  <!-- --------------------------------------------------------------- foot -->
  <footer id="foot">
    <div id="ask" hidden role="alertdialog" aria-labelledby="ask-q"></div>

    <div class="composer-wrap">
      <form id="composer">
        <label class="sr-only" for="prompt">What would you like done?</label>
        <textarea id="prompt" rows="1" placeholder="Ask for something…"
                  autocomplete="off" spellcheck="false"></textarea>
        <div class="composer-bar">
          <label class="sr-only" for="mode">What the agent is allowed to do</label>
          <span class="mode-wrap">
            <select id="mode">
              <option value="act">Act</option>
              <option value="plan">Plan</option>
              <option value="chat">Chat</option>
            </select>
          </span>
          <span id="mode-note"></span>
          <span class="grow"></span>
          <button type="button" id="stop" hidden>
            <svg aria-hidden="true"><use href="#i-stop"/></svg> Stop</button>
          <button type="submit" id="send" aria-label="Send">
            <svg aria-hidden="true"><use href="#i-send"/></svg></button>
        </div>
      </form>
    </div>

    <p class="hint"><kbd>Enter</kbd> sends · <kbd>Shift</kbd>+<kbd>Enter</kbd>
      for a new line · <kbd>Esc</kbd> stops</p>

    <div id="status" data-live="true">
      <span class="bit"><span class="dot"></span>
        <span class="link-word" id="link">connected</span></span>
      <span class="bit"><svg aria-hidden="true"><use href="#i-folder"/></svg>
        <span class="path mono" id="where">—</span></span>
      <span class="bit optional" title="Context used">
        <svg aria-hidden="true"><use href="#i-gauge"/></svg>
        <span class="gauge" id="gauge" data-full="false"><i style="width:0"></i></span>
        <b id="ctx">0%</b></span>
      <span class="bit optional" id="spend-bit" hidden title="Spent this session">
        <svg aria-hidden="true"><use href="#i-coins"/></svg>
        <b id="spend">$0.00</b></span>
      <span class="bit optional" id="reflex-bit" hidden title="What the brain holds">
        <svg aria-hidden="true"><use href="#i-brain"/></svg>
        <b id="reflex">0</b> rules</span>
      <span class="grow"></span>
      <span class="bit" id="tokens"></span>
    </div>
  </footer>
</div>

<div id="toasts" aria-live="polite"></div>

<script src="/ui.js"></script>
</body>
</html>
