# A label whose name contains a colon has to be quoted, or YAML reads it
# as a nested mapping and the whole file fails to parse.

Documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "**/*.md"

Testing:
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**"
          - "workers/**/*.test.mjs"
          - "workers/**/*.test.js"

Benchmark:
  - changed-files:
      - any-glob-to-any-file:
          - "bench/**"

CI:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"

"Area: Core":
  - changed-files:
      - any-glob-to-any-file:
          - "src/**"

"Area: Configuration":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.toml"
          - "**/*.ini"
          - "**/*.cfg"
          - "**/*.yaml"
          - "**/*.yml"
          - ".env.example"

"Area: GitHub":
  - changed-files:
      - any-glob-to-any-file:
          - "src/comodor/github/**"
          - "src/comodor/tools/github.py"
          - "workers/site/github/**"
          - "docs/github.md"

"Area: Cloudflare":
  - changed-files:
      - any-glob-to-any-file:
          - "workers/**"
          - "wrangler.json"
          - "wrangler.jsonc"

Security:
  - changed-files:
      - any-glob-to-any-file:
          - "src/comodor/github/identity.py"
          - "src/comodor/github/tokens.py"
          - "workers/site/github/jwt.js"
          - "workers/site/github/oauth.js"
          - "workers/site/github/grant.js"
          - "workers/site/github/state.js"
          - "workers/site/github/webhook.js"

Build:
  - changed-files:
      - any-glob-to-any-file:
          - "pyproject.toml"
          - "setup.py"
          - "setup.cfg"
          - "MANIFEST.in"

Dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "pyproject.toml"
          - "requirements*.txt"
          - "constraints*.txt"
          - "uv.lock"
          - "poetry.lock"
          - "Pipfile"
          - "Pipfile.lock"

Release:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/release.yml"
          - "RELEASING.md"
