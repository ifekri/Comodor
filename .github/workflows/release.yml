name: Release

# Two ways to release:
#
#   * push a tag `vX.Y.Z` — the normal path, so what ships is a specific,
#     immutable commit;
#   * run it by hand and untick "dry run" — for the first publish, or to
#     recover from a failed one.
#
# Every run ends with a summary saying exactly what it did, because a workflow
# called "Release" that finishes green without publishing anything is the most
# confusing outcome available.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — build and verify only, publish nothing'
        type: boolean
        default: true

permissions:
  contents: read

env:
  # Publishing happens on a tag push, or on a manual run with dry run turned
  # off. Written once here so the jobs cannot drift apart.
  SHOULD_PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}

jobs:
  gate:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Tests
        # The whole suite, not a fast subset. A gate that runs something other
        # than what the developer runs is a gate nobody trusts and everybody
        # eventually bypasses.
        run: pytest -q

      - name: Performance ceilings
        run: pytest -m performance -n 0 -q

      - name: Say what passed
        run: |
          {
            echo "## Gate"
            echo
            echo "Lint and the full test suite passed. Building."
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build distributions
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ env.SHOULD_PUBLISH }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The version is derived from the tag, so the tag has to be here.
          # A shallow checkout gets the commit and none of the history, and
          # every build would come out as 0.1.dev1.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Read the version off the artefact
        id: version
        # Nothing in the tree carries a version number: hatch-vcs derives it
        # from the tag, so the two cannot disagree - which is exactly what
        # v0.2.1 did on its first attempt, failing the release because a
        # literal in __init__.py had been left behind at 0.2.0.
        #
        # Read from the built wheel rather than by asking the build backend
        # what it would do. The filename is the answer that is actually going
        # to PyPI, and it needs no library to interpret.
        run: |
          wheel=$(ls dist/*.whl | head -1)
          version=$(basename "$wheel" | cut -d- -f2)
          if [ -z "$version" ]; then
            echo "::error::No version in the wheel name: $wheel"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Package version: $version"

      - name: A tag must produce its own version
        if: github.ref_type == 'tag'
        # It cannot fail without something being badly wrong - a shallow
        # checkout, or a tag that is not an ancestor of this commit - but the
        # cost of finding out afterwards is a version number PyPI will never
        # let us use again.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="${{ steps.version.outputs.version }}"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag built version $version."
            echo "The checkout is probably shallow, or the tag is not an ancestor." >&2
            exit 1
          fi

      - name: Check the metadata PyPI will render
        run: twine check --strict dist/*

      - name: The wheel installs, runs, and agrees with the tag
        # The last word on what is about to be published is the artefact
        # itself, not the metadata that produced it.
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet dist/*.whl
          reported=$(/tmp/verify/bin/comodor --version | awk '{print $2}')
          echo "The wheel reports: $reported"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$reported" != "$tag" ]; then
              echo "::error::Tag v$tag produced a wheel reporting $reported."
              echo "The checkout is probably shallow, or the tag is not an ancestor." >&2
              exit 1
            fi
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

      - name: Say what this run is going to do
        run: |
          {
            echo "## Comodor ${{ steps.version.outputs.version }}"
            echo
            echo '```'
            ls -1 dist/
            echo '```'
            echo
            if [ "$SHOULD_PUBLISH" = "true" ]; then
              echo "**Publishing to PyPI.**"
            else
              echo "### Dry run — nothing was published"
              echo
              echo "The distributions above were built and verified, and that is all."
              echo "To publish for real:"
              echo
              echo "- push a tag: \`git tag v${{ steps.version.outputs.version }} && git push --tags\`, or"
              echo "- run this workflow again with **dry run** unticked."
              echo
              echo "PyPI also needs a trusted publisher configured first — see RELEASING.md."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: needs.build.outputs.publish == 'true'

    # The environment is what PyPI's trusted publisher is scoped to, and it is
    # also where a required reviewer can be added if you want releases to pause
    # for a human.
    environment:
      name: pypi
      url: https://pypi.org/p/comodor

    permissions:
      # Trusted publishing: GitHub mints a short-lived OIDC token that PyPI
      # verifies. No API token is stored anywhere, so there is nothing to leak
      # and nothing to rotate.
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

      - name: Record what shipped
        run: |
          {
            echo "## Published"
            echo
            echo "comodor ${{ needs.build.outputs.version }} is on PyPI."
            echo
            echo '```bash'
            echo "pipx install comodor==${{ needs.build.outputs.version }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    name: Attach to the GitHub release
    needs: [build, publish]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Install
            ### Linux and MacOS
              ```bash
              curl -fsSL get.comodor.ai | sh
              ```
            ### Windows
              ```bash
              irm get.comodor.ai | iex
              ```
            ### UV

              ```bash
              uv tool install comodor==${{ needs.build.outputs.version }}
              ```

            ### PIP
              ```bash
              pip install comodor==${{ needs.build.outputs.version }}
              ```

            ### PIPX
              ```bash
            pipx install comodor==${{ needs.build.outputs.version }}
              ```

  # The container image, built from this release and pushed to both registries.
  #
  # Chained here rather than triggered by `release: [published]`, which does not
  # fire when the release is created by a workflow — GitHub does not raise
  # events for anything done with GITHUB_TOKEN. v0.20.3 shipped and no image was
  # ever built. Running it here also puts it after `publish`, so PyPI has the
  # version the Dockerfile is about to ask for.
  image:
    name: Container image
    needs: [build, publish]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/image.yml
    with:
      version: ${{ needs.build.outputs.version }}
    permissions:
      contents: read
      packages: write
    # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN. A called workflow gets no secrets
    # unless they are passed, and the push would silently fall back to GHCR.
    secrets: inherit
