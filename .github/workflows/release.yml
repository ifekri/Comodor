name: Release

# Release paths:
#
# 1. Push a tag `vX.Y.Z`:
#    Normal production release path. The tag identifies the exact immutable
#    source commit that is being published.
#
# 2. workflow_dispatch, dry run (the default):
#    Build and verify, publish nothing. With `target_version` the run is a
#    rehearsal of that release: the build names itself the version and
#    every destination is asked what it holds for the tag the version
#    would have — without that tag existing. Without it, a development
#    dry run: the source's own version, no destination asked.
#
# 3. workflow_dispatch on an existing tag, dry_run=false:
#    Recovery: publish that tag's release, reconciled like a push.
#
# A run on a branch never publishes, whatever was typed into the inputs.
# Production publication is anchored to a tag ref, twice: `SHOULD_PUBLISH`
# below says so, and the `identity` job says so again, in Python, and
# refuses the combinations that must not exist (a branch with dry_run off,
# a target that is not a release version, a target that is not the tag).
#
# The workflow is intentionally split into:
#
#   Release identity
#       ↓
#   Quality gate
#       ↓
#   Build distributions
#       ↓
#   PyPI plan → Publish to PyPI (only what PyPI is missing)
#      ↙         ↘
# GitHub Release  Container Image
#       ↘         ↙
#   Publication summary
#
# Every destination is reconciled on its own by `tools/release-reconcile.py`:
# what is already there and correct is verified and skipped, what is missing
# is published, and what is there but is not this release stops the run. So
# the same tag can be run again after a failure at any point and finishes
# the release instead of failing on what the first run already did. The
# GitHub Release and the container image are independent after PyPI holds
# the version; a release page that cannot be completed never blocks the
# image, and vice versa.

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — build and verify only, publish nothing'
        type: boolean
        default: true
      target_version:
        description: 'Rehearse this release (X.Y.Z) without its tag — dry run only'
        type: string
        default: ''

permissions:
  contents: read

env:
  # Only a tag ref publishes: pushed, or run by hand with dry_run off.
  # A branch never does, and no input changes that.
  SHOULD_PUBLISH: ${{ github.ref_type == 'tag' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)) }}

jobs:

  # ---------------------------------------------------------------------------
  # Release identity
  # ---------------------------------------------------------------------------
  #
  # What this run is about, decided once, in one testable place: the
  # version the build must produce, the tag the destinations are asked
  # about, and whether anything may be written. The rules are in
  # `decide_identity` in tools/release-reconcile.py; a combination the
  # rules refuse stops the run here, before anything is built.

  identity:
    name: Release identity
    runs-on: ubuntu-latest

    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      publish: ${{ steps.decide.outputs.publish }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide what this run releases
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
          TARGET: ${{ inputs.target_version }}
          SHOULD_PUBLISH_EXPR: ${{ env.SHOULD_PUBLISH }}
        run: |
          python3 tools/release-reconcile.py identity \
            --event "$EVENT" --ref-type "$REF_TYPE" --ref-name "$REF_NAME" \
            --dry-run "$DRY_RUN" --target-version "$TARGET"

          # Two gates, one answer. If the expression and the rules ever
          # disagree about publishing, neither is trusted.
          decided="$(grep '^publish=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)"
          if [ "$decided" != "$SHOULD_PUBLISH_EXPR" ]; then
            echo "::error::the identity rules say publish=$decided, the workflow expression says $SHOULD_PUBLISH_EXPR"
            exit 1
          fi

      - name: Record the identity
        env:
          MODE: ${{ steps.decide.outputs.mode }}
          VERSION: ${{ steps.decide.outputs.version }}
          TAG: ${{ steps.decide.outputs.tag }}
          PUBLISH: ${{ steps.decide.outputs.publish }}
        shell: bash
        run: |
          {
            case "$MODE" in
              production) echo "## Production release of \`$TAG\`" ;;
              recovery)   echo "## Recovery of the \`$TAG\` release" ;;
              rehearsal)  echo "## Rehearsal of \`$TAG\` — DRY RUN, ZERO PRODUCTION MUTATIONS" ;;
              *)          echo "## Development dry run — DRY RUN, ZERO PRODUCTION MUTATIONS" ;;
            esac
            echo
            echo "Build version: \`${VERSION:-the source version}\` · release asked about: \`${TAG:-none}\` · publishing: \`$PUBLISH\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Quality Gate
  # ---------------------------------------------------------------------------

  gate:
    name: Quality gate
    needs: identity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # A production tag must not silently point at an older main commit.
      #
      # A tag outside main is allowed deliberately for maintenance/hotfix
      # releases, but a tag that is merely behind main is rejected.
      - name: The tag must not be behind main
        if: needs.identity.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git fetch --quiet origin main

          tag="${GITHUB_REF_NAME}"

          if git merge-base --is-ancestor "$tag" origin/main; then
            behind="$(git rev-list --count "$tag"..origin/main)"

            if [ "$behind" -gt 0 ]; then
              {
                echo "## Refusing to release"
                echo
                echo "\`$tag\` is **$behind commit(s) behind \`main\`**."
                echo
                echo "Publishing this tag would ship an older tree under a newer"
                echo "version number."
                echo
                echo "PyPI versions are immutable and cannot be replaced."
                echo
                echo "Create the tag from the current intended release commit."
              } >> "$GITHUB_STEP_SUMMARY"

              echo "::error::$tag is $behind commit(s) behind main"
              exit 1
            fi
          else
            echo "::warning::$tag is not an ancestor of main. Treating it as a maintenance/hotfix release."

            {
              echo "## Release branch notice"
              echo
              echo "\`$tag\` is not an ancestor of \`main\`."
              echo
              echo "The workflow will allow the release, assuming this is an intentional"
              echo "maintenance or hotfix release."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests bench tools

      - name: Tests
        run: pytest -q

      - name: Performance ceilings
        run: pytest -m performance -n 0 -q

      - name: Record quality gate
        shell: bash
        run: |
          {
            echo "## Quality gate"
            echo
            echo "All required release checks passed:"
            echo
            echo "- Lint"
            echo "- Full test suite"
            echo "- Performance ceilings"
          } >> "$GITHUB_STEP_SUMMARY"


  # ---------------------------------------------------------------------------
  # Build
  # ---------------------------------------------------------------------------

  build:
    name: Build distributions
    needs: [identity, gate]
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      wheel: ${{ steps.version.outputs.wheel }}
      # Both gates, and both must say yes.
      publish: ${{ needs.identity.outputs.publish == 'true' && env.SHOULD_PUBLISH == 'true' }}
      mode: ${{ needs.identity.outputs.mode }}
      tag: ${{ needs.identity.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip build twine

      # The production TUI artifact is committed for the wheel and sdist to
      # carry; a release wheel must render on every supported platform, so
      # the backends the commit's own platform did not have are fetched at
      # the lockfile's pinned version before packaging. Build-time only:
      # runtime never downloads anything.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: npm ci

      - name: Build the production TUI artifact for every platform
        run: bun tools/build-tui-distribution.ts --platforms all

      # The rebuild above rewrites `src/comodor/tui/dist/manifest.json` — the
      # committed one names the backend of the machine it was built on, and
      # this one names all of them — so from here the tree is dirty, and
      # hatch-vcs would version the wheel `X.Y.Z+dYYYYMMDD`. A release must
      # publish `X.Y.Z`, so a run with a release identity names its own
      # version (a tag's, or the rehearsed one). Never blindly: the only
      # change allowed is the artifact just built. Anything else dirty
      # means the tag and the build disagree, and that is refused.
      - name: The only change since the tag is the rebuilt artifact
        shell: bash
        run: |
          set -euo pipefail

          unexpected="$(git status --porcelain | grep -v ' src/comodor/tui/dist/' || true)"

          if [ -n "$unexpected" ]; then
            echo "::error::The tree changed outside src/comodor/tui/dist/ during the build:"
            echo "$unexpected"
            exit 1
          fi

      - name: Build sdist and wheel
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.identity.outputs.version }}
        run: |
          set -euo pipefail

          # A release identity names the version — a tag's, or the one a
          # rehearsal was asked for. A development dry run builds the
          # source's own version and stays honest about being one.
          if [ -n "$RELEASE_VERSION" ]; then
            export SETUPTOOLS_SCM_PRETEND_VERSION="$RELEASE_VERSION"
          fi

          python -m build

      - name: The retired interface is not in the wheel
        run: python tools/check-wheel-contents.py dist/*.whl

      - name: Read version from built wheel
        id: version
        shell: bash
        run: |
          set -euo pipefail

          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"

          if [ -z "$wheel" ]; then
            echo "::error::No wheel was produced."
            exit 1
          fi

          version="$(basename "$wheel" | cut -d- -f2)"

          if [ -z "$version" ]; then
            echo "::error::Could not determine package version from: $wheel"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "wheel=$(basename "$wheel")" >> "$GITHUB_OUTPUT"
          echo "Package version: $version"

      - name: A release must produce its own version
        if: needs.identity.outputs.version != ''
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.identity.outputs.version }}
          BUILT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          if [ "$RELEASE_VERSION" != "$BUILT_VERSION" ]; then
            echo "::error::Release $RELEASE_VERSION produced package version $BUILT_VERSION."
            echo "::error::The release and the built artefact must have exactly the same version."
            exit 1
          fi

          # The wheel's own metadata, not only its filename.
          python - <<'PY'
          import os, re, sys, zipfile, glob
          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as archive:
              meta = [n for n in archive.namelist() if n.endswith(".dist-info/METADATA")][0]
              text = archive.read(meta).decode("utf-8")
          version = re.search(r"^Version: (.+)$", text, re.M).group(1).strip()
          wanted = os.environ["RELEASE_VERSION"]
          print(f"METADATA Version: {version}")
          if version != wanted:
              print(f"::error::the wheel's METADATA says {version}, not {wanted}")
              sys.exit(1)
          PY

      - name: Check package metadata
        run: twine check --strict dist/*

      - name: Verify the built wheel
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.identity.outputs.version }}
        run: |
          set -euo pipefail

          python -m venv /tmp/comodor-release-verify
          /tmp/comodor-release-verify/bin/pip install --quiet dist/*.whl

          reported="$(
            /tmp/comodor-release-verify/bin/comodor --version |
            awk '{print $2}'
          )"

          echo "Installed wheel reports version: $reported"

          if [ -n "$RELEASE_VERSION" ] && [ "$reported" != "$RELEASE_VERSION" ]; then
            echo "::error::Release $RELEASE_VERSION produced a wheel reporting $reported."
            exit 1
          fi

      - name: Upload distributions artifact
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

      - name: Record build
        shell: bash
        run: |
          {
            echo "## Comodor ${{ steps.version.outputs.version }}"
            echo
            echo "Built distributions:"
            echo
            echo '```text'
            ls -1 dist/
            echo '```'
            echo

            if [ "${{ needs.identity.outputs.publish }}" = "true" ] && [ "$SHOULD_PUBLISH" = "true" ]; then
              echo "**Production publication is enabled for this run.**"
            else
              echo "**Dry run — no package, release or production image will be published.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"


  # ---------------------------------------------------------------------------
  # PyPI
  # ---------------------------------------------------------------------------
  #
  # Two jobs, so that the plan needs no environment and the environment is
  # entered only when there is something to upload. The plan classifies the
  # version on PyPI against the files this run built — ABSENT, PARTIAL,
  # COMPLETE or CONFLICT — and stages only the files PyPI does not hold. A
  # file it holds with the digest this build produced is verified and left
  # alone; a file it holds with another digest stops the release. PyPI never
  # takes a filename twice, so nothing is ever uploaded twice.

  pypi-plan:
    name: PyPI plan
    needs: build
    runs-on: ubuntu-latest

    outputs:
      state: ${{ steps.plan.outputs.state }}
      uploads: ${{ steps.plan.outputs.uploads }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Compare the build with what PyPI holds
        id: plan
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python tools/release-reconcile.py pypi \
            --version "$VERSION" --dist dist/ --stage publish/

      # Only the files PyPI is missing travel to the publish job.
      - name: Stage the files PyPI is missing
        if: steps.plan.outputs.uploads != '0'
        uses: actions/upload-artifact@v4
        with:
          name: pypi-uploads
          path: publish/
          if-no-files-found: error

  pypi-publish:
    name: Publish to PyPI
    needs: [build, pypi-plan]
    runs-on: ubuntu-latest

    # Nothing to do is a successful outcome for the jobs after this one;
    # they read `needs.pypi-publish.result` as `skipped` and go on.
    if: needs.build.outputs.publish == 'true' && needs.pypi-plan.outputs.uploads != '0'

    environment:
      name: pypi
      url: https://pypi.org/p/comodor

    permissions:
      id-token: write

    outputs:
      state: ${{ steps.verify.outputs.state }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Download the files PyPI is missing
        uses: actions/download-artifact@v4
        with:
          name: pypi-uploads
          path: publish/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish/

      # Every file this run built is on PyPI with the digest it was built
      # with, or the release stops here — before anything else is published
      # against a package that is not there.
      - name: Verify the version is complete on PyPI
        id: verify
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python tools/release-reconcile.py pypi \
            --version "$VERSION" --dist dist/ --verify --wait 300


  # ---------------------------------------------------------------------------
  # GitHub Release
  # ---------------------------------------------------------------------------
  #
  # A release object is not a release; the page has to carry the files. The
  # tool classifies the tag's release against the distributions this run
  # built and does only what is missing:
  #
  #   no release           create a draft, attach every file, publish it
  #   draft                attach what is missing, publish it
  #   published, complete  verify the digests and stop
  #   published, mutable   attach what is missing, verify
  #   published, immutable cannot be completed: fail, and say so plainly
  #   asset differs        never replaced: fail
  #
  # It runs after PyPI has the version — a rerun where PyPI was already
  # complete finds `pypi-publish` skipped, which is why `always()` is here
  # and why the first step checks PyPI itself rather than trusting a job
  # result. It runs whenever the identity names a tag: a real one, or the
  # one a rehearsal asks about — read-only then, since nothing publishes.

  github-release:
    name: GitHub release
    needs: [build, pypi-plan, pypi-publish]
    runs-on: ubuntu-latest

    if: >-
      always()
      && needs.build.result == 'success'
      && needs.pypi-plan.result == 'success'
      && needs.pypi-publish.result != 'failure'
      && needs.pypi-publish.result != 'cancelled'
      && needs.build.outputs.tag != ''

    permissions:
      contents: write

    outputs:
      found: ${{ steps.reconcile.outputs.found }}
      state: ${{ steps.reconcile.outputs.state }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: PyPI holds the version this release page will describe
        if: needs.build.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python tools/release-reconcile.py pypi \
            --version "$VERSION" --dist dist/ --verify --wait 300 --summary ""

      - name: Reconcile the GitHub Release
        id: reconcile
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          APPLY: ${{ needs.build.outputs.publish == 'true' && '--apply' || '' }}
        run: |
          # A dry run passes no flag, and the tool then reads and reports only.
          python tools/release-reconcile.py github \
            --tag "$TAG" --version "$VERSION" --dist dist/ \
            --repo "$GITHUB_REPOSITORY" $APPLY


  # ---------------------------------------------------------------------------
  # Container Image
  # ---------------------------------------------------------------------------
  #
  # Independent of the GitHub Release: a release page that cannot be
  # completed must never keep the image from being published. The called
  # workflow reconciles GHCR and Docker Hub the same way — a version tag
  # that resolves and verifies is kept, `latest` is retagged to it without a
  # rebuild, and a version tag that resolves to something else stops the
  # run. A dry run builds and tests the image and publishes nothing.

  image:
    name: Container image
    needs: [build, pypi-plan, pypi-publish]

    if: >-
      always()
      && needs.build.result == 'success'
      && needs.pypi-plan.result == 'success'
      && needs.pypi-publish.result != 'failure'
      && needs.pypi-publish.result != 'cancelled'
      && (needs.build.outputs.tag != '' || needs.build.outputs.publish != 'true')

    uses: ./.github/workflows/image.yml

    with:
      version: ${{ needs.build.outputs.version }}
      revision: ${{ github.sha }}
      dry_run: ${{ needs.build.outputs.publish != 'true' }}
      # A rehearsal installs the wheel this run built: the version is not
      # on PyPI, and the image must still carry exactly it.
      wheel: ${{ needs.build.outputs.mode == 'rehearsal' && needs.build.outputs.wheel || '' }}

    permissions:
      contents: read
      packages: write

    # Required for optional Docker Hub publication.
    #
    # GHCR uses GITHUB_TOKEN automatically.
    # Docker Hub requires:
    #
    #   DOCKERHUB_USERNAME
    #   DOCKERHUB_TOKEN
    #
    # The called workflow handles the absence of those secrets and falls back
    # to GHCR-only publication.
    secrets: inherit


  # ---------------------------------------------------------------------------
  # Summary
  # ---------------------------------------------------------------------------
  #
  # One table, whatever happened: what each destination held, and what this
  # run did about it. Read this before deciding anything about a rerun.

  summary:
    name: Publication summary
    needs: [build, pypi-plan, pypi-publish, github-release, image]
    runs-on: ubuntu-latest

    if: always() && needs.build.result == 'success'

    steps:
      - name: Write the summary
        env:
          VERSION: ${{ needs.build.outputs.version }}
          MODE: ${{ needs.build.outputs.mode }}
          TAG: ${{ needs.build.outputs.tag }}
          PUBLISH: ${{ needs.build.outputs.publish }}
          PYPI_PLAN: ${{ needs.pypi-plan.outputs.state }}
          PYPI_UPLOADS: ${{ needs.pypi-plan.outputs.uploads }}
          PYPI_RESULT: ${{ needs.pypi-publish.result }}
          PYPI_AFTER: ${{ needs.pypi-publish.outputs.state }}
          RELEASE_RESULT: ${{ needs.github-release.result }}
          RELEASE_FOUND: ${{ needs.github-release.outputs.found }}
          RELEASE_STATE: ${{ needs.github-release.outputs.state }}
          IMAGE_RESULT: ${{ needs.image.result }}
          GHCR_FOUND: ${{ needs.image.outputs.ghcr_found }}
          GHCR_STATE: ${{ needs.image.outputs.ghcr_state }}
          GHCR_LATEST: ${{ needs.image.outputs.ghcr_latest }}
          HUB_FOUND: ${{ needs.image.outputs.dockerhub_found }}
          HUB_STATE: ${{ needs.image.outputs.dockerhub_state }}
          HUB_LATEST: ${{ needs.image.outputs.dockerhub_latest }}
        shell: bash
        run: |
          set -euo pipefail

          # What was found and what was (or would be) done, per destination.
          # A destination that was not asked is said to be not asked, never
          # guessed at.
          case "$MODE" in
            production) title="Comodor $VERSION — production release of $TAG"; mode="Publishing run." ;;
            recovery)   title="Comodor $VERSION — recovery of $TAG"; mode="Publishing run." ;;
            rehearsal)  title="Comodor $VERSION — publication rehearsal of $TAG"
                        mode="**DRY RUN — ZERO PRODUCTION MUTATIONS.** Version-targeted release rehearsal: the build named itself $VERSION and every destination was asked what it holds for $TAG; the outcomes are what a publishing run would do." ;;
            *)          title="Comodor $VERSION — development dry run"
                        mode="**DRY RUN — ZERO PRODUCTION MUTATIONS.** Generic development dry run: the source's own version was built and tested; no release was asked about." ;;
          esac

          if [ "$PUBLISH" = "true" ]; then
            pypi_verb="uploaded"; verb="published"
          else
            pypi_verb="would upload"; verb="would publish"
          fi

          {
            echo "## $title"
            echo
            echo "$mode"
            echo
            echo "| Destination | Found | Outcome |"
            echo "|---|---|---|"

            case "$PYPI_RESULT" in
              success) pypi="$pypi_verb $PYPI_UPLOADS file(s) → ${PYPI_AFTER:-verified}" ;;
              skipped) if [ "$PYPI_UPLOADS" = "0" ]; then pypi="no-op: already complete";
                       else pypi="$pypi_verb $PYPI_UPLOADS file(s)"; fi ;;
              *)       pypi="$PYPI_RESULT" ;;
            esac
            echo "| PyPI \`comodor==$VERSION\` | ${PYPI_PLAN:-—} | $pypi |"

            case "$RELEASE_RESULT" in
              success)
                if [ "$PUBLISH" = "true" ]; then
                  release="${RELEASE_STATE:-—}"
                else
                  case "$RELEASE_FOUND" in
                    ABSENT)   release="$verb: create draft, attach assets, publish" ;;
                    PARTIAL)  release="$verb: attach what is missing" ;;
                    COMPLETE) release="no-op: already complete" ;;
                    *)        release="${RELEASE_FOUND:-—}" ;;
                  esac
                fi
                echo "| GitHub Release \`$TAG\` | ${RELEASE_FOUND:-—} | $release |" ;;
              skipped)
                echo "| GitHub Release | not asked | no release tag in this run |" ;;
              *)
                echo "| GitHub Release \`$TAG\` | ${RELEASE_FOUND:-—} | $RELEASE_RESULT |" ;;
            esac

            row_image() { # name found state latest
              if [ -z "$2" ]; then
                echo "| $1 | not asked | no release version in this run |"
                return
              fi
              case "$2" in
                ABSENT)          outcome="$verb: build and push; latest → $VERSION" ;;
                COMPLETE)        outcome="no-op on the version tag; latest ${4:-—}" ;;
                NOT_CONFIGURED)  outcome="skipped: no credentials" ;;
                *)               outcome="$2" ;;
              esac
              if [ "$PUBLISH" = "true" ]; then
                outcome="${3:-—}; latest ${4:-—}"
              fi
              echo "| $1 | $2 | $outcome |"
            }
            case "$IMAGE_RESULT" in
              success)
                row_image "GHCR \`ghcr.io/ifekri/comodor:$VERSION\`" "$GHCR_FOUND" "$GHCR_STATE" "$GHCR_LATEST"
                row_image "Docker Hub \`comodor:$VERSION\`" "$HUB_FOUND" "$HUB_STATE" "$HUB_LATEST" ;;
              skipped)
                echo "| GHCR | not asked | no image job in this run |"
                echo "| Docker Hub | not asked | no image job in this run |" ;;
              *)
                echo "| GHCR | ${GHCR_FOUND:-—} | $IMAGE_RESULT |"
                echo "| Docker Hub | ${HUB_FOUND:-—} | $IMAGE_RESULT |" ;;
            esac

            if [ "$PUBLISH" != "true" ]; then
              echo
              echo "DRY RUN — ZERO PRODUCTION MUTATIONS: nothing was uploaded, created, pushed, retagged or tagged."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
