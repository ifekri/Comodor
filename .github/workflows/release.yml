name: Release

# Release paths:
#
# 1. Push a tag `vX.Y.Z`:
#    Normal production release path. The tag identifies the exact immutable
#    source commit that is being published.
#
# 2. workflow_dispatch:
#    Build/verify by default. Publishing is enabled only when dry_run=false.
#
# The workflow is intentionally split into:
#
#   Quality gate
#       ↓
#   Build distributions
#       ↓
#   Publish to PyPI
#      ↙         ↘
# GitHub Release  Container Image
#
# GitHub Release and Container Image are independent after PyPI succeeds.
# A pre-existing GitHub Release must never prevent PyPI or Docker publication.

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — build and verify only, publish nothing'
        type: boolean
        default: true

permissions:
  contents: read

env:
  SHOULD_PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}

jobs:

  # ---------------------------------------------------------------------------
  # Quality Gate
  # ---------------------------------------------------------------------------

  gate:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # A production tag must not silently point at an older main commit.
      #
      # A tag outside main is allowed deliberately for maintenance/hotfix
      # releases, but a tag that is merely behind main is rejected.
      - name: The tag must not be behind main
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail

          git fetch --quiet origin main

          tag="${GITHUB_REF_NAME}"

          if git merge-base --is-ancestor "$tag" origin/main; then
            behind="$(git rev-list --count "$tag"..origin/main)"

            if [ "$behind" -gt 0 ]; then
              {
                echo "## Refusing to release"
                echo
                echo "\`$tag\` is **$behind commit(s) behind \`main\`**."
                echo
                echo "Publishing this tag would ship an older tree under a newer"
                echo "version number."
                echo
                echo "PyPI versions are immutable and cannot be replaced."
                echo
                echo "Create the tag from the current intended release commit."
              } >> "$GITHUB_STEP_SUMMARY"

              echo "::error::$tag is $behind commit(s) behind main"
              exit 1
            fi
          else
            echo "::warning::$tag is not an ancestor of main. Treating it as a maintenance/hotfix release."

            {
              echo "## Release branch notice"
              echo
              echo "\`$tag\` is not an ancestor of \`main\`."
              echo
              echo "The workflow will allow the release, assuming this is an intentional"
              echo "maintenance or hotfix release."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests bench tools

      - name: Tests
        run: pytest -q

      - name: Performance ceilings
        run: pytest -m performance -n 0 -q

      - name: Record quality gate
        shell: bash
        run: |
          {
            echo "## Quality gate"
            echo
            echo "All required release checks passed:"
            echo
            echo "- Lint"
            echo "- Full test suite"
            echo "- Performance ceilings"
          } >> "$GITHUB_STEP_SUMMARY"


  # ---------------------------------------------------------------------------
  # Build
  # ---------------------------------------------------------------------------

  build:
    name: Build distributions
    needs: gate
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ env.SHOULD_PUBLISH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip build twine

      # The production TUI artifact is committed for the wheel and sdist to
      # carry; a release wheel must render on every supported platform, so
      # the backends the commit's own platform did not have are fetched at
      # the lockfile's pinned version before packaging. Build-time only:
      # runtime never downloads anything.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: npm ci

      - name: Build the production TUI artifact for every platform
        run: bun tools/build-tui-distribution.ts --platforms all

      # The rebuild above rewrites `src/comodor/tui/dist/manifest.json` — the
      # committed one names the backend of the machine it was built on, and
      # this one names all of them — so from here the tree is dirty, and
      # hatch-vcs would version the wheel `X.Y.Z+dYYYYMMDD`. A tag must
      # publish `X.Y.Z`, so a tag build names its own version. Never blindly:
      # the only change allowed is the artifact just built. Anything else
      # dirty means the tag and the build disagree, and that is refused.
      - name: The only change since the tag is the rebuilt artifact
        shell: bash
        run: |
          set -euo pipefail

          unexpected="$(git status --porcelain | grep -v ' src/comodor/tui/dist/' || true)"

          if [ -n "$unexpected" ]; then
            echo "::error::The tree changed outside src/comodor/tui/dist/ during the build:"
            echo "$unexpected"
            exit 1
          fi

      - name: Build sdist and wheel
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            export SETUPTOOLS_SCM_PRETEND_VERSION="${GITHUB_REF_NAME#v}"
          fi

          python -m build

      - name: The retired interface is not in the wheel
        run: python tools/check-wheel-contents.py dist/*.whl

      - name: Read version from built wheel
        id: version
        shell: bash
        run: |
          set -euo pipefail

          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"

          if [ -z "$wheel" ]; then
            echo "::error::No wheel was produced."
            exit 1
          fi

          version="$(basename "$wheel" | cut -d- -f2)"

          if [ -z "$version" ]; then
            echo "::error::Could not determine package version from: $wheel"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Package version: $version"

      - name: A tag must produce its own version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail

          tag_version="${GITHUB_REF_NAME#v}"
          built_version="${{ steps.version.outputs.version }}"

          if [ "$tag_version" != "$built_version" ]; then
            echo "::error::Tag v$tag_version produced package version $built_version."
            echo "::error::The release tag and built artefact must have exactly the same version."
            exit 1
          fi

      - name: Check package metadata
        run: twine check --strict dist/*

      - name: Verify the built wheel
        shell: bash
        run: |
          set -euo pipefail

          python -m venv /tmp/comodor-release-verify
          /tmp/comodor-release-verify/bin/pip install --quiet dist/*.whl

          reported="$(
            /tmp/comodor-release-verify/bin/comodor --version |
            awk '{print $2}'
          )"

          echo "Installed wheel reports version: $reported"

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"

            if [ "$reported" != "$tag_version" ]; then
              echo "::error::Tag v$tag_version produced a wheel reporting $reported."
              exit 1
            fi
          fi

      - name: Upload distributions artifact
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

      - name: Record build
        shell: bash
        run: |
          {
            echo "## Comodor ${{ steps.version.outputs.version }}"
            echo
            echo "Built distributions:"
            echo
            echo '```text'
            ls -1 dist/
            echo '```'
            echo

            if [ "$SHOULD_PUBLISH" = "true" ]; then
              echo "**Production publication is enabled for this run.**"
            else
              echo "**Dry run — no package, release or production image will be published.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"


  # ---------------------------------------------------------------------------
  # PyPI
  # ---------------------------------------------------------------------------

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    if: needs.build.outputs.publish == 'true'

    environment:
      name: pypi
      url: https://pypi.org/p/comodor

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Record PyPI publication
        shell: bash
        run: |
          {
            echo "## PyPI"
            echo
            echo "Published:"
            echo
            echo "\`comodor==${{ needs.build.outputs.version }}\`"
            echo
            echo '```bash'
            echo "pipx install comodor==${{ needs.build.outputs.version }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"


  # ---------------------------------------------------------------------------
  # GitHub Release
  # ---------------------------------------------------------------------------
  #
  # Important:
  #
  # GitHub can make published releases immutable. If the repository owner
  # creates and publishes the release from the GitHub UI before this workflow
  # reaches this job, uploading assets afterwards will fail.
  #
  # Therefore:
  #
  # - Published release already exists:
  #     Treat this stage as satisfied.
  #     Do NOT try to mutate it.
  #     Missing assets produce a warning only.
  #
  # - Draft release already exists:
  #     Attach/replace the distributions and publish the draft.
  #
  # - No release exists:
  #     Create a draft first, upload all assets while mutation is still allowed,
  #     then publish it.
  #
  # This makes the GitHub Release stage idempotent without hiding real errors.

  github-release:
    name: GitHub release
    needs: [build, publish]
    runs-on: ubuntu-latest

    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Inspect existing GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          endpoint="repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}"

          if gh api "$endpoint" > /tmp/release.json 2> /tmp/release.err; then
            draft="$(jq -r '.draft // false' /tmp/release.json)"
            immutable="$(jq -r '.immutable // false' /tmp/release.json)"
            release_id="$(jq -r '.id' /tmp/release.json)"

            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "draft=$draft" >> "$GITHUB_OUTPUT"
            echo "immutable=$immutable" >> "$GITHUB_OUTPUT"
            echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

            echo "GitHub Release $TAG already exists."
            echo "draft=$draft"
            echo "immutable=$immutable"

          else
            if grep -q "HTTP 404" /tmp/release.err; then
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "draft=false" >> "$GITHUB_OUTPUT"
              echo "immutable=false" >> "$GITHUB_OUTPUT"
              echo "release_id=" >> "$GITHUB_OUTPUT"

              echo "GitHub Release $TAG does not exist."
            else
              echo "::error::Unable to determine whether GitHub Release $TAG exists."
              cat /tmp/release.err >&2
              exit 1
            fi
          fi

      # A published release is already a valid release result.
      #
      # In particular, an immutable release MUST NOT receive another upload
      # attempt. Doing so is the exact failure this branch prevents.
      - name: Existing published release satisfies this stage
        if: steps.release.outputs.exists == 'true' && steps.release.outputs.draft != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          endpoint="repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}"

          mapfile -t published_assets < <(
            gh api "$endpoint" --jq '.assets[].name'
          )

          missing=0

          for file in dist/*; do
            name="$(basename "$file")"

            if ! printf '%s\n' "${published_assets[@]}" | grep -Fxq "$name"; then
              echo "::warning::Existing release $TAG does not contain asset: $name"
              missing=1
            fi
          done

          {
            echo "## GitHub Release"
            echo
            echo "\`$TAG\` already exists and is published."
            echo
            echo "The existing release is treated as a completed release stage."
            echo
            echo "No attempt was made to modify or upload assets to it."

            if [ "${{ steps.release.outputs.immutable }}" = "true" ]; then
              echo
              echo "The release is immutable."
            fi

            if [ "$missing" -eq 1 ]; then
              echo
              echo "> [!WARNING]"
              echo "> One or more distribution assets are not attached to the existing"
              echo "> GitHub Release. This does not fail the workflow because the"
              echo "> release was already published and may be immutable."
              echo ">"
              echo "> The package itself was published to PyPI successfully."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # A draft release can still accept assets safely.
      - name: Attach distributions to existing draft
        if: steps.release.outputs.exists == 'true' && steps.release.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          gh release upload "$TAG" \
            dist/* \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      # If no release exists, create it as a draft first.
      #
      # Assets must be attached before publication because published releases
      # may become immutable.
      - name: Create draft release and attach distributions
        if: steps.release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true

          body: |
            ## Install

            ### Linux and macOS

            ```bash
            curl -fsSL get.comodor.ai | sh
            ```

            ### Windows

            ```powershell
            irm get.comodor.ai | iex
            ```

            ### UV

            ```bash
            uv tool install comodor==${{ needs.build.outputs.version }}
            ```

            ### PIP

            ```bash
            pip install comodor==${{ needs.build.outputs.version }}
            ```

            ### PIPX

            ```bash
            pipx install comodor==${{ needs.build.outputs.version }}
            ```

      # Publish either:
      #
      # - the draft we found before this job, or
      # - the draft we just created.
      #
      # A release that was already published never reaches this step.
      - name: Publish prepared draft release
        if: steps.release.outputs.exists != 'true' || steps.release.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          release_id="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
              --jq '.id'
          )"

          if [ -z "$release_id" ]; then
            echo "::error::Could not determine GitHub Release ID for $TAG."
            exit 1
          fi

          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -F draft=false \
            > /dev/null

          echo "Published GitHub Release $TAG."

      - name: Verify GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          draft="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
              --jq '.draft'
          )"

          if [ "$draft" = "true" ]; then
            echo "::error::GitHub Release $TAG still exists only as a draft."
            exit 1
          fi

          url="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
              --jq '.html_url'
          )"

          {
            echo "## GitHub Release verified"
            echo
            echo "Release: \`$TAG\`"
            echo
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"


  # ---------------------------------------------------------------------------
  # Container Image
  # ---------------------------------------------------------------------------
  #
  # Docker publication deliberately does NOT depend on the GitHub Release job.
  #
  # Once the package is successfully on PyPI, the container can be built.
  # A manually-created or immutable GitHub Release must never prevent Docker
  # publication.

  image:
    name: Container image
    needs: [build, publish]

    if: startsWith(github.ref, 'refs/tags/v')

    uses: ./.github/workflows/image.yml

    with:
      version: ${{ needs.build.outputs.version }}

    permissions:
      contents: read
      packages: write

    # Required for optional Docker Hub publication.
    #
    # GHCR uses GITHUB_TOKEN automatically.
    # Docker Hub requires:
    #
    #   DOCKERHUB_USERNAME
    #   DOCKERHUB_TOKEN
    #
    # The called workflow handles the absence of those secrets and falls back
    # to GHCR-only publication.
    secrets: inherit
