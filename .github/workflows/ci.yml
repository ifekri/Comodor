name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: ruff check src tests tools

  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13']
        include:
          # The terminal layer has real platform-specific code — raw console
          # modes, the msvcrt fallback, path handling — so Windows and macOS
          # are covered rather than assumed.
          - os: windows-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'

    steps:
      - uses: actions/checkout@v4
        with:
          # The version comes from the tag, so a one-commit checkout makes
          # every build read as 0.1.dev1 - which is confusing in a log and
          # wrong in anything that prints it.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      # `-n auto --dist loadfile` comes from pyproject, so this is the same
      # command a developer runs. The suite is mostly waiting — sockets,
      # subprocesses and deliberate timeouts — so the cores are nearly free:
      # an hour of wall clock became about three minutes on a four-core runner.
      - name: Test
        run: pytest -q

      # Alone, and on one process. These measure wall-clock time against a
      # ceiling, so a worker sharing the runner with three others measures the
      # runner rather than the code — recall came back at 313ms against a 5ms
      # budget for exactly that reason. Excluded from the run above by marker,
      # so they have to be run here or the ceilings stop being enforced.
      - name: Performance ceilings
        run: pytest -m performance -n 0 -q

      - name: The CLI actually starts
        run: |
          comodor --version
          comodor doctor || true

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node runs the packages a desktop client would reuse: the protocol
      # types, the client, the command registry, the question reducer. They
      # are plain TypeScript on purpose, and this is where that is checked.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # Declarations only — nothing consumes emitted JavaScript, because Node
      # and Bun both run the TypeScript sources directly. It is here because a
      # project that cannot emit its own types is one a consumer cannot use.
      - name: Build
        run: npm run build

  renderer:
    name: TUI renderer on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # A terminal renderer is exactly the kind of thing that works on one
        # platform and not another — console modes, encodings, process
        # lifetimes — so all three are run rather than assumed.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      # Bun, pinned, because OpenTUI draws through native code bound with
      # `bun:ffi` and `node:ffi` is not a module in any released Node. This
      # is the only job that needs it, and nobody has to install it by hand
      # to work on the rest of the repository.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # A real renderer, real key bytes, real clicks, and assertions against
      # the characters on screen. Reducer tests cannot see a text that sizes
      # itself to one column and clips everything typed into it — that bug
      # was in this interface, and this is the suite that found it.
      - name: Renderer
        run: bun test apps/tui/test/bun/renderer.test.tsx

      # And a real core in its own process: that the client can drive one,
      # and that closing leaves nothing behind.
      - name: A real core, and no orphan
        env:
          # Named rather than assumed: `python` on a Windows runner can
          # resolve to the Store alias, which is not an interpreter.
          COMODOR_PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
        run: bun test apps/tui/test/bun/orphan.test.ts

      - name: What it costs
        run: bun apps/tui/test/bun/measure.tsx

  desktop:
    name: Desktop on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The desktop window owns a Core process and talks to a real WebView,
        # and both differ per platform: process trees, the WebView engine, the
        # single-instance channel. All three are the evidence (FR-033).
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # Named rather than assumed, as in the renderer job.
      COMODOR_PYTHON: ${{ matrix.os == 'windows-latest' && 'python' || 'python3' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # WebKitGTK is the Linux WebView; the window needs a display and the
      # single-instance plugin a D-Bus session, which the harness starts.
      - name: Linux WebView and display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libsoup-3.0-dev libxdo-dev libssl-dev pkg-config build-essential \
            xvfb xauth dbus dbus-x11

      # The toolchain pinned in apps/desktop/src-tauri/rust-toolchain.toml.
      - name: Rust
        shell: bash
        run: |
          channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' apps/desktop/src-tauri/rust-toolchain.toml)
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal

      # The native crate embeds the built page, so the page is built first.
      - name: Build the page
        run: npm run -w apps/desktop build

      - name: Native unit and integration tests
        working-directory: apps/desktop/src-tauri
        run: cargo test

      # The test build's own support: the network-listener report must see a
      # listener when there is one, or its empty answer proves nothing.
      - name: Test-build support
        working-directory: apps/desktop/src-tauri
        run: cargo test --features e2e --lib e2e::tests

      - name: Window tests
        run: npm run -w apps/desktop test

      # The test build in a real WebView, against the scripted Core.
      - name: In-application scenarios
        run: npm run -w apps/desktop e2e

      - name: Keep what the scenarios left
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-${{ matrix.os }}
          path: apps/desktop/e2e/out
          if-no-files-found: ignore

  packaged:
    name: Installed package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: python -m pip install --upgrade pip && pip install build

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The production artifact is built from the checkout, so the wheel the
      # next step builds cannot silently ship yesterday's renderer.
      - run: npm ci

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Build the production TUI artifact
        run: bun tools/build-tui-distribution.ts

      - name: The committed artifact is not stale
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # The bundle and its assets must be reproducible; the manifest and
          # the native backend differ per platform by definition, so they are
          # outside this comparison — `comodor doctor` verifies them instead.
          git status --porcelain -- src/comodor/tui/dist/ ':(exclude)src/comodor/tui/dist/manifest.json' ':(exclude)src/comodor/tui/dist/node_modules' | tee stale.txt
          test ! -s stale.txt || (echo "src/comodor/tui/dist is stale: rebuild it with bun tools/build-tui-distribution.ts and commit the result" && exit 1)

      - name: Build the wheel and the sdist
        run: python -m build

      - name: The retired interface is not in the wheel
        run: python tools/check-wheel-contents.py dist/*.whl

      - name: Install the wheel into a clean environment
        shell: bash
        run: |
          python -m venv smoke-venv
          WHEEL=$(ls dist/*.whl | head -1)
          if [ "${{ runner.os }}" = "Windows" ]; then
            smoke-venv/Scripts/python -m pip install "$WHEEL"
          else
            smoke-venv/bin/python -m pip install "$WHEEL"
          fi

      # The default interface is the packaged renderer: these run from a
      # directory that is not the checkout, against the wheel just installed,
      # so a renderer that only exists in the repo cannot pass them.
      - name: The installed package answers from outside the checkout
        shell: bash
        run: |
          mkdir -p somewhere-else && cd somewhere-else
          if [ "${{ runner.os }}" = "Windows" ]; then
            PY="../smoke-venv/Scripts/python"
          else
            PY="../smoke-venv/bin/python"
          fi
          COMODOR_HOME="$PWD/home" $PY -m comodor --version
          COMODOR_HOME="$PWD/home" $PY -m comodor --help > /dev/null
          COMODOR_HOME="$PWD/home" $PY -m comodor doctor > doctor.txt || true
          grep -q "renderer from the package" doctor.txt
          # The retired command is refused by the parser, and starts nothing.
          if COMODOR_HOME="$PWD/home" $PY -m comodor legacy 2> legacy.txt; then
            echo "comodor legacy still runs"; exit 1
          fi
          grep -q "invalid choice" legacy.txt

      - name: The installed demo starts the packaged renderer
        shell: bash
        run: |
          cd somewhere-else
          if [ "${{ runner.os }}" = "Windows" ]; then
            PY="../smoke-venv/Scripts/python"
          else
            PY="../smoke-venv/bin/python"
          fi
          # The probe is a checked-in script rather than a string built
          # here: it has to kill a process tree and read output through
          # files, and both of those deserve a comment and a test rather
          # than a printf. See tools/smoke-installed-demo.py for why pipes
          # hung this step for six hours on Windows.
          COMODOR_HOME="$PWD/home" $PY ../tools/smoke-installed-demo.py

