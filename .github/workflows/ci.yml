name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: ruff check src tests

  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13']
        include:
          # The terminal layer has real platform-specific code — raw console
          # modes, the msvcrt fallback, path handling — so Windows and macOS
          # are covered rather than assumed.
          - os: windows-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'

    steps:
      - uses: actions/checkout@v4
        with:
          # The version comes from the tag, so a one-commit checkout makes
          # every build read as 0.1.dev1 - which is confusing in a log and
          # wrong in anything that prints it.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: The CLI actually starts
        run: |
          comodor --version
          comodor doctor || true
