name: Pages

# Builds the site as a static export and publishes it to GitHub Pages.
#
# Lives on the `site` branch and only ever runs from it, so `main` — the branch
# somebody lands on when they come to read the agent — is untouched by any of
# this.
#
# Where the site lives decides how it is built, and getting it wrong produces a
# page that loads without its stylesheet — broken-looking rather than obviously
# misconfigured. So there is one switch and it defaults to the real thing:
#
#   push (or manual, preview off)  built for SITE_DOMAIN — assets at the root,
#                                  and a CNAME, without which Pages drops the
#                                  domain on the next deploy.
#   manual with preview: true      built for the github.io URL, assets under
#                                  /<repo>.
#
# Both directions are asserted before the artifact is uploaded.

on:
  push:
    branches: [site]
  workflow_dispatch:
    inputs:
      preview:
        description: 'Build for the github.io URL instead of the custom domain'
        type: boolean
        default: false

# The domain this site is for. A push builds for it, because that is the target
# state — building for the github.io preview by default would mean every
# ordinary commit shipped a version that is broken on the real domain.
env:
  SITE_DOMAIN: comodor.ai

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one in flight: a half-published
# site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Decide where the site will live
        id: where
        run: |
          # A custom domain serves from the root; the github.io URL serves from
          # /<repo>. The two are mutually exclusive and getting it wrong ships
          # a page with no stylesheet, so it is decided once, here.
          if [ "${{ inputs.preview }}" = "true" ]; then
            base="/${{ github.event.repository.name }}"
            domain=""
          else
            base=""
            domain="${SITE_DOMAIN}"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "domain=$domain" >> "$GITHUB_OUTPUT"
          {
            echo "### Publishing"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| base path | \`${base:-(root)}\` |"
            echo "| custom domain | \`${domain:-(none)}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check the install scripts before shipping them
        run: sh tools/check-scripts.sh

      - name: Build
        env:
          NEXT_STATIC_EXPORT: '1'
          NEXT_BASE_PATH: ${{ steps.where.outputs.base }}
        run: npm run build

      - name: Make it servable by Pages
        run: |
          # Without this, Pages runs the output through Jekyll, which ignores
          # every directory beginning with an underscore — including `_next`,
          # which is the entire stylesheet and every script.
          touch out/.nojekyll

          if [ -n "${{ steps.where.outputs.domain }}" ]; then
            echo "${{ steps.where.outputs.domain }}" > out/CNAME
          fi

      - name: The build actually produced a site
        run: |
          # A green deploy of an empty directory is the failure that wastes the
          # most time, so the artifact is inspected rather than trusted.
          test -f out/index.html || { echo "::error::no index.html"; exit 1; }
          test -f out/.nojekyll || { echo "::error::no .nojekyll"; exit 1; }
          test -f out/install.sh || { echo "::error::no install.sh"; exit 1; }
          test -f out/install-sh.txt || { echo "::error::no install-sh.txt"; exit 1; }

          # CRLF here is fatal and silent: /bin/sh reads the carriage return as
          # part of the last token and dies before printing anything.
          if grep -q $'\r' out/install.sh; then
            echo "::error::install.sh has CRLF line endings"
            exit 1
          fi
          sh -n out/install.sh

          # Assets have to match wherever the site is about to live. Both
          # directions are checked, because both failures look identical to a
          # visitor: a page that renders with no stylesheet.
          base='${{ steps.where.outputs.base }}'
          if [ -n "$base" ]; then
            grep -q "$base/_next/" out/index.html || {
              echo "::error::assets are not prefixed with $base — unstyled on the github.io URL"
              exit 1
            }
          else
            grep -q '"/_next/' out/index.html || {
              echo "::error::assets are not root-relative — unstyled on the custom domain"
              exit 1
            }
            test -f out/CNAME || { echo "::error::no CNAME; Pages would drop the domain"; exit 1; }
          fi

          {
            echo
            echo "\`\`\`"
            ls -1 out
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Say where it went
        run: |
          {
            echo "### Deployed"
            echo
            echo "${{ steps.deployment.outputs.page_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
