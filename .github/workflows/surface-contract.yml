name: Surface Contract

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: surface-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  surface-impact:
    name: Surface Impact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate PR Surface Impact contract
        run: python tools/validate-surface-impact.py --event-file "$GITHUB_EVENT_PATH"

  capability-map:
    name: Capability Map
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -e .
      - name: Validate code-derived capability map
        run: python tools/capability-map.py --check
