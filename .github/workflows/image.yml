# Build the image and publish it, so `docker run ghcr.io/ifekri/comodor` works
# without anyone cloning anything.
#
# This runs from `main`. It used to run from a branch of its own, which is the
# reason the published image sat eleven releases behind: a release never
# touched that branch, so nothing ever rebuilt. Now a tag rebuilds it, and a
# pull request that changes the Dockerfile has to prove the image still starts.
#
# Nothing to configure: GHCR accepts the token Actions already provides, so
# there is no secret to add. It builds for both architectures on a release,
# because half the laptops this would run on are ARM and an amd64-only image
# runs there through emulation at about a third of the speed.

name: Image

on:
  push:
    branches: [main]
    # Written out twice rather than shared with a YAML anchor: GitHub Actions
    # does not expand anchors, and the failure is a workflow that silently
    # matches nothing.
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - docker-compose.yml
      - .github/workflows/image.yml
  # Called by `release.yml` once the package is actually on PyPI.
  #
  # Not `release: [published]`, which looks right and does not work. A release
  # created by a workflow is created with GITHUB_TOKEN, and GitHub deliberately
  # does not fire workflow events for those — so v0.20.3 shipped and no image
  # was ever built. When it *did* fire, for a release made by hand, it raced:
  # the build started at 12:44:32 and asked PyPI for a version the publish job
  # had not finished uploading.
  workflow_call:
    inputs:
      version:
        description: "Comodor version to install"
        required: false
        type: string
      revision:
        description: "Commit the release was built from, for the image label"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Build and test, plan the publication, publish nothing"
        required: false
        default: false
        type: boolean
    outputs:
      ghcr_found:
        value: ${{ jobs.build.outputs.ghcr_found }}
      ghcr_state:
        value: ${{ jobs.build.outputs.ghcr_state }}
      ghcr_latest:
        value: ${{ jobs.build.outputs.ghcr_latest }}
      dockerhub_found:
        value: ${{ jobs.build.outputs.dockerhub_found }}
      dockerhub_state:
        value: ${{ jobs.build.outputs.dockerhub_state }}
      dockerhub_latest:
        value: ${{ jobs.build.outputs.dockerhub_latest }}
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - docker-compose.yml
      - .github/workflows/image.yml
  workflow_dispatch:
    inputs:
      version:
        description: "Comodor version to install (empty means the newest)"
        required: false
        default: ""
        type: string

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    # What each registry held, and what it holds now. `found` is the plan's
    # reading before anything was pushed; `state` is after (or the plan's,
    # on a dry run, which pushes nothing).
    outputs:
      ghcr_found: ${{ steps.ghcr.outputs.state }}
      ghcr_state: ${{ steps.ghcr_apply.outputs.state || steps.ghcr.outputs.state }}
      ghcr_latest: ${{ steps.ghcr_apply.outputs.latest || steps.ghcr.outputs.latest }}
      dockerhub_found: ${{ steps.hubplan.outputs.state }}
      dockerhub_state: ${{ steps.hub_apply.outputs.state || steps.hubplan.outputs.state }}
      dockerhub_latest: ${{ steps.hub_apply.outputs.latest || steps.hubplan.outputs.latest }}
    # A ceiling on the whole thing. One of these steps ran a server in the
    # foreground and captured its output, which hung for three hours before
    # anybody noticed. Every wait below is bounded as well; this is the
    # backstop for the one that is not.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Only where it will be published. Emulating arm64 to build an image
      # nobody will pull costs about four minutes on every pull request, and
      # a dry run publishes nothing either.
      - if: github.event_name != 'pull_request' && inputs.dry_run != true
        uses: docker/setup-qemu-action@v3

      - if: github.event_name != 'pull_request'
        name: Sign in to GitHub's registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is where somebody looks first, and `docker run comodor` with
      # no registry prefix means Docker Hub. Skipped, rather than failed, when
      # the secrets are not set: a fork has neither, and an image that reaches
      # GHCR is still a published image.
      - id: hub
        if: github.event_name != 'pull_request'
        name: Is Docker Hub configured
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$USERNAME" ] && [ -n "$TOKEN" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
            echo "repo=$USERNAME/comodor" >> "$GITHUB_OUTPUT"
            echo "Publishing to Docker Hub as $USERNAME/comodor"
          else
            echo "ready=" >> "$GITHUB_OUTPUT"
            echo "repo=" >> "$GITHUB_OUTPUT"
            echo "No Docker Hub credentials — GHCR only."
          fi

      - if: steps.hub.outputs.ready == 'yes'
        name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # A release names a version. The image workflow is also run for a push
      # to `main` that touches the Dockerfile (no version: `edge`), for a pull
      # request (built, never pushed) and for a dry run of the release (the
      # same as a pull request, plus the plan a publishing run would follow).
      - name: Which version
        id: pick
        env:
          # One expression for both callers: `inputs` covers workflow_call and
          # workflow_dispatch alike.
          WANTED: ${{ inputs.version }}
          DRY: ${{ inputs.dry_run }}
        run: |
          echo "version=$WANTED" >> "$GITHUB_OUTPUT"
          # Only a release version names an image tag worth reconciling: a
          # dry run from a branch builds `2.0.2.dev3+g1234abc`, which no
          # registry tag can carry.
          if [[ "$WANTED" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release=yes" >> "$GITHUB_OUTPUT"
          else
            echo "release=" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "$DRY" = "true" ]; then
            echo "publish=" >> "$GITHUB_OUTPUT"
          else
            echo "publish=yes" >> "$GITHUB_OUTPUT"
          fi
          echo "Building Comodor ${WANTED:-newest release}"

      # PyPI is a CDN, and a version that has just been uploaded is not
      # instantly installable everywhere. Without this the build asks for a
      # version that exists and gets told it does not, which reads as a broken
      # Dockerfile rather than as a race. A dry run of a version that is not
      # on PyPI builds the newest release instead, and says so.
      - name: Wait for PyPI to have it
        id: pypi
        if: steps.pick.outputs.version != ''
        env:
          VERSION: ${{ steps.pick.outputs.version }}
          PUBLISH: ${{ steps.pick.outputs.publish }}
        run: |
          attempts=30
          [ -n "$PUBLISH" ] || attempts=1
          for attempt in $(seq 1 $attempts); do
            if curl -fsS -m 10 "https://pypi.org/pypi/comodor/$VERSION/json" -o /dev/null; then
              echo "comodor $VERSION is on PyPI."
              echo "install=$VERSION" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "  not there yet ($attempt/$attempts)"
            [ "$attempt" -lt "$attempts" ] && sleep 10
          done
          if [ -z "$PUBLISH" ]; then
            echo "::notice::comodor $VERSION is not on PyPI; the dry run builds the newest release"
            echo "install=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::comodor $VERSION never appeared on PyPI"
          exit 1

      # What each registry holds for this version, and what to do about it.
      # The tool reads only; the build and the retag below act on its plan.
      #
      #   ABSENT     build and push the version tag
      #   COMPLETE   keep it; retag `latest` to it if `latest` is elsewhere
      #   CONFLICT   a version tag that is not this release: stop
      - name: Plan GHCR
        id: ghcr
        if: steps.pick.outputs.release == 'yes' && github.event_name != 'pull_request'
        env:
          VERSION: ${{ steps.pick.outputs.version }}
        run: |
          python3 tools/release-reconcile.py image --name GHCR \
            --repository "ghcr.io/${{ github.repository_owner }}/comodor" \
            --version "$VERSION"

      # Docker Hub gets the same image: pushed by the same build when both
      # registries lack the version, copied registry-to-registry from the
      # verified GHCR image when only Docker Hub lacks it. Never a second
      # build — two builds would publish two images and test one.
      - name: Plan Docker Hub
        id: hubplan
        if: steps.pick.outputs.release == 'yes' && github.event_name != 'pull_request'
        env:
          VERSION: ${{ steps.pick.outputs.version }}
          REPO: ${{ steps.hub.outputs.repo }}
          SOURCE: ${{ steps.ghcr.outputs.state == 'COMPLETE' && format('ghcr.io/{0}/comodor:{1}', github.repository_owner, steps.pick.outputs.version) || '' }}
        run: |
          if [ -z "$REPO" ]; then
            python3 tools/release-reconcile.py image --name "Docker Hub" \
              --repository "docker.io/comodor" --version "$VERSION" --not-configured
          else
            python3 tools/release-reconcile.py image --name "Docker Hub" \
              --repository "$REPO" --version "$VERSION" --source "$SOURCE"
          fi

      # The tags one build pushes. On a release: the version tags the plan
      # says to build, and nothing else — `latest` is moved afterwards by
      # retagging, never by a build. Off a release (`edge`): as before,
      # `latest` and `edge` together. A pull request or dry run pushes
      # nothing; the local tag names the image under test.
      - name: Which tags
        id: tags
        env:
          VERSION: ${{ steps.pick.outputs.version }}
          RELEASE: ${{ steps.pick.outputs.release }}
          PUBLISH: ${{ steps.pick.outputs.publish }}
          HUB: ${{ steps.hub.outputs.repo }}
          GHCR_BUILD: ${{ steps.ghcr.outputs.build }}
          HUB_BUILD: ${{ steps.hubplan.outputs.build }}
        run: |
          owner="${{ github.repository_owner }}"
          label="${VERSION:-edge}"
          build=""
          {
            echo "list<<EOF"
            if [ -z "$PUBLISH" ]; then
              echo "ghcr.io/$owner/comodor:$label"
              build=yes
            elif [ -z "$RELEASE" ]; then
              echo "ghcr.io/$owner/comodor:latest"
              echo "ghcr.io/$owner/comodor:$label"
              if [ -n "$HUB" ]; then
                echo "$HUB:latest"
                echo "$HUB:$label"
              fi
              build=yes
            else
              if [ "$GHCR_BUILD" = "true" ]; then
                echo "ghcr.io/$owner/comodor:$label"
                build=yes
              fi
              if [ -n "$HUB" ] && [ "$HUB_BUILD" = "true" ]; then
                echo "$HUB:$label"
                build=yes
              fi
            fi
            echo "EOF"
            echo "build=$build"
            echo "test=ghcr.io/$owner/comodor:$label"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        if: steps.tags.outputs.build == 'yes'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.pick.outputs.publish == 'yes'
                         && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ steps.pick.outputs.publish == 'yes' }}
          load: ${{ steps.pick.outputs.publish != 'yes' }}
          build-args: |
            COMODOR_VERSION=${{ steps.pypi.outputs.install }}
            COMODOR_REVISION=${{ inputs.revision }}
          # One build, pushed to both. Building twice would publish two
          # images from two runs of the same Dockerfile, and only one of them
          # would have been tested.
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Now the version tag resolves in each registry (built just now, or
      # there already and verified): copy it to Docker Hub if that is what
      # its plan said, and point `latest` at it where `latest` is elsewhere.
      # Registry-side retags; nothing is rebuilt. Then each registry is read
      # back and must verify, or the job fails.
      - name: Publish GHCR
        id: ghcr_apply
        if: steps.pick.outputs.release == 'yes' && steps.pick.outputs.publish == 'yes'
        env:
          VERSION: ${{ steps.pick.outputs.version }}
        run: |
          python3 tools/release-reconcile.py image --name GHCR \
            --repository "ghcr.io/${{ github.repository_owner }}/comodor" \
            --version "$VERSION" --apply --verify --summary ""

      - name: Publish Docker Hub
        id: hub_apply
        if: steps.pick.outputs.release == 'yes' && steps.pick.outputs.publish == 'yes' && steps.hub.outputs.repo != ''
        env:
          VERSION: ${{ steps.pick.outputs.version }}
          REPO: ${{ steps.hub.outputs.repo }}
        run: |
          python3 tools/release-reconcile.py image --name "Docker Hub" \
            --repository "$REPO" --version "$VERSION" \
            --source "ghcr.io/${{ github.repository_owner }}/comodor:$VERSION" \
            --apply --verify --summary ""

      # On a pull request or dry run the build is loaded into the local
      # daemon rather than pushed, so the same tag names it either way. On a
      # release it is the version tag in GHCR — built just now or found and
      # verified — which is pulled, so what is tested is what is published.
      - name: Name the image under test
        id: image
        run: echo "ref=${{ steps.tags.outputs.test }}" >> "$GITHUB_OUTPUT"

      # The label says the version and the label is checked by the plan; this
      # asks the image itself, which is the proof the label stands for.
      - name: The image carries the version it is tagged with
        if: steps.pypi.outputs.install != ''
        env:
          VERSION: ${{ steps.pypi.outputs.install }}
        run: |
          image="${{ steps.image.outputs.ref }}"
          reported="$(docker run --rm --entrypoint comodor "$image" --version | awk '{print $2}')"
          echo "The image reports: $reported"
          if [ "$reported" != "$VERSION" ]; then
            echo "::error::$image reports comodor $reported, not $VERSION"
            exit 1
          fi

      # With no key it starts anyway and says the page will ask.
      #
      # This step asserted the opposite until it hung a workflow for three
      # hours: it was written when the image installed 0.9.0, which refused to
      # start without a provider. That changed on purpose — the browser
      # interface can take a key now, and refusing to start made it
      # unreachable for exactly the person most likely to want it, whose
      # Comodor is in a container with no terminal in front of them.
      #
      # So what is checked is the current contract: it comes up, and it says
      # out loud that a key is still needed. `timeout` because a step that runs
      # a server and reads its output must never be able to wait forever.
      - name: With no key, it starts and says a key is still needed
        run: |
          image="${{ steps.image.outputs.ref }}"
          docker run --rm -d -t --name check-nokey             -p 127.0.0.1:8766:8765 "$image"

          ready=""
          for _ in $(seq 1 30); do
            sleep 2
            code=$(curl -s -m 5 -o /dev/null -w '%{http_code}'                    http://127.0.0.1:8766/ || true)
            if [ "$code" = "401" ]; then ready=yes; break; fi
            docker ps --filter name=check-nokey --format '{{.Names}}'               | grep -q check-nokey || break
          done

          logs=$(timeout 30 docker logs check-nokey 2>&1 || true)
          docker rm -f check-nokey >/dev/null 2>&1 || true
          echo "$logs"

          if [ -z "$ready" ]; then
            echo "::error::it never served without a key, which is how the"
            echo "::error::browser interface is reached on a machine with no terminal"
            exit 1
          fi
          case "$logs" in
            *"No provider is configured"*) ;;
            *) echo "::error::it started without saying a key is still needed"
               exit 1 ;;
          esac
          echo "It serves, and it says what is still missing."

      # `-d` is the case that used to hang: compose sets `tty: true`, so a
      # container has a terminal whether or not anybody is reading it, and the
      # setup questions would have been asked of nobody.
      - name: With a key, it serves and wants the token
        run: |
          image="${{ steps.image.outputs.ref }}"
          docker run --rm -d -t --name check \
            -e ANTHROPIC_API_KEY=sk-not-a-real-key \
            -p 127.0.0.1:8765:8765 "$image"
          for _ in $(seq 1 30); do
            sleep 2
            code=$(curl -s -m 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/ || true)
            # 401 is the right answer to a request with no token: it is up.
            if [ "$code" = "401" ]; then
              echo "It is serving, and it refused a request without the token."
              timeout 30 docker logs check | head -30 || true
              break
            fi
            docker ps --filter name=check --format '{{.Names}}' | grep -q check || break
          done
          if [ "${code:-}" != "401" ]; then
            echo "::error::it never answered."
            timeout 30 docker logs check 2>&1 | head -40 || true
            docker rm -f check 2>/dev/null || true
            exit 1
          fi

      # The address is the one thing the person who started the container
      # needs, and it has to be in the logs — not only on a terminal that a
      # detached run does not have.
      - name: The logs carry an address that can be opened
        run: |
          logs=$(timeout 30 docker logs check 2>&1 || true)
          case "$logs" in
            *"http://127.0.0.1:8765/?token="*) ;;
            *)
              echo "::error::the logs do not carry an openable address"
              echo "$logs" | head -40
              docker rm -f check 2>/dev/null || true
              exit 1 ;;
          esac
          case "$logs" in
            *"0.0.0.0:8765"*)
              echo "::error::it printed the bind address, which nobody can open"
              docker rm -f check 2>/dev/null || true
              exit 1 ;;
          esac
          echo "The address in the logs is one a browser can open."
          docker rm -f check

      - name: The healthcheck reports healthy
        run: |
          image="${{ steps.image.outputs.ref }}"
          docker run --rm -d -t --name health \
            -e ANTHROPIC_API_KEY=sk-not-a-real-key "$image"
          for _ in $(seq 1 40); do
            sleep 3
            state=$(docker inspect --format '{{.State.Health.Status}}' health 2>/dev/null || echo gone)
            [ "$state" = "healthy" ] && break
            [ "$state" = "gone" ] && break
          done
          docker rm -f health >/dev/null 2>&1 || true
          if [ "$state" != "healthy" ]; then
            echo "::error::the container never became healthy (last: $state)"
            exit 1
          fi
          echo "Healthy."
