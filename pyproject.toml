[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "comodor"
dynamic = ["version"]
description = "Comodor — a self-improving terminal coding agent with a Rich TUI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MMDRZA", email = "mohammadreza.fekri.mojdehi@gmail.com" }]
keywords = ["agent", "llm", "tui", "rich", "coding-assistant", "terminal", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
# One dependency. The HTTP client, SSE reader and config loader are
# all part of the package, so installing Comodor pulls in nothing else.
dependencies = ["rich>=13.7"]

[project.urls]
Homepage = "https://comodor.ai"
Repository = "https://github.com/ifekri/Comodor"
Issues = "https://github.com/ifekri/Comodor/issues"
Changelog = "https://github.com/ifekri/Comodor/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.14"]

[project.scripts]
comodor = "comodor.cli:main"

# The tag is the version. Nothing in the tree carries a number to keep in step
# with it, so nothing can fall out of step with it: `git tag v0.3.0` is the
# whole of a release. `_version.py` is generated at build time - including by an
# editable install - and is not committed.
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/comodor/_version.py"]

[tool.ruff.lint]
# Chosen by counting what each family actually found in this tree, not by
# taking a preset. The reasoning is in the commit that added this.
select = ["F", "E4", "E7", "E9", "E501", "W", "I", "B", "C4", "PIE"]

[tool.ruff.lint.per-file-ignores]
# A table of models, one per line, whose columns line up across rows.
# That alignment is why it can be read at a glance, and wrapping every
# row onto two lines to satisfy a column count would cost more than the
# rule is worth here.
"src/comodor/providers/registry.py" = ["E501"]
# A test may import a name only to prove it is importable, and its fixtures
# shadow each other by design.
"tests/*" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["comodor"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/comodor/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/comodor"]

[tool.hatch.build.targets.sdist]
include = ["src/comodor", "tests", "pyproject.toml", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
