[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "comodor"
dynamic = ["version"]
description = "Comodor — a self-improving terminal coding agent with a Rich TUI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mmdrza", email = "devfekri@gmail.com" }]
keywords = ["agent", "llm", "tui", "rich", "coding-assistant", "terminal", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
]
# One dependency. The HTTP client, SSE reader and config loader are
# all part of the package, so installing Comodor pulls in nothing else.
dependencies = ["rich>=13.7"]

[project.urls]
Homepage = "https://comodor.ai"
Repository = "https://github.com/ifekri/Comodor"
Issues = "https://github.com/ifekri/Comodor/issues"
Changelog = "https://github.com/ifekri/Comodor/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Test-time only. `pip install comodor` still pulls in rich and nothing else —
# the one-dependency claim is about what a user installs, and none of these
# travel with it. PyYAML is here so the tests can read `docker-compose.yml` and
# the workflows as documents rather than as strings; asserting on the text of a
# YAML file is how a test ends up agreeing with a broken one.
# pytest-xdist because the suite is mostly waiting: sockets, subprocesses
# and deliberate timeouts, none of which compete for a CPU. Serially it
# ran for an hour on every CI job; the work itself was minutes.
dev = ["pytest>=8.0", "pytest-xdist>=3.5", "ruff>=0.14", "pyyaml>=6.0"]

[project.scripts]
comodor = "comodor.cli:main"

# The tag is the version. Nothing in the tree carries a number to keep in step
# with it, so nothing can fall out of step with it: `git tag v0.3.0` is the
# whole of a release. `_version.py` is generated at build time - including by an
# editable install - and is not committed.
[tool.ruff]
line-length = 100
target-version = "py311"
# The benchmark's task repositories are fixtures, not source. They are the
# starting state a model is measured against, and tidying them changes what is
# being measured — one judge pins a line number, and an import reordered by a
# linter would silently move it.
extend-exclude = [
    "src/comodor/_version.py",
    "bench/tasks/*/repo",
    "bench/tasks/*/hidden",
]

[tool.ruff.lint]
# Chosen by counting what each family actually found in this tree, not by
# taking a preset. The reasoning is in the commit that added this.
select = ["F", "E4", "E7", "E9", "E501", "W", "I", "B", "C4", "PIE"]

[tool.ruff.lint.per-file-ignores]
# A table of models, one per line, whose columns line up across rows.
# That alignment is why it can be read at a glance, and wrapping every
# row onto two lines to satisfy a column count would cost more than the
# rule is worth here.
"src/comodor/providers/registry.py" = ["E501"]
# A test may import a name only to prove it is importable, and its fixtures
# shadow each other by design.
"tests/*" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["comodor"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/comodor/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/comodor"]

[tool.hatch.build.targets.sdist]
include = ["src/comodor", "tests", "pyproject.toml", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# One process per core, and each test file kept whole on one worker. The
# grouping matters: several files build a real server or a browser in a
# module-scoped fixture, and splitting a file across workers would build it
# once per worker rather than once.
addopts = "-n auto --dist loadfile"
